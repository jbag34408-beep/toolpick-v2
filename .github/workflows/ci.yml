# CI(지속적 통합): PR을 올리거나 main에 푸시하면 자동으로 테스트·빌드를 돌린다
# [CS] 사람이 깜빡해도 깨진 코드가 main에 들어가지 못하게 기계가 매번 검사한다.
# 브랜치 보호 규칙과 함께 쓰면 "CI 통과 + 리뷰 승인"이 머지 조건이 된다
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # backend와 frontend 작업은 서로 다른 러너(가상 머신)에서 동시에(병렬로) 돈다
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4            # 저장소 코드 받기
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4 # Gradle 캐시로 다음 실행을 빠르게
      - name: 테스트 (Testcontainers는 러너의 Docker 사용)
        run: ./gradlew test --no-daemon

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci          # package-lock.json에 적힌 버전 그대로 설치(재현 가능한 설치)
      - run: npm run lint    # 코드 규칙 검사(ESLint)
      - run: npm run build   # 타입 검사 + 프로덕션 빌드
        env:
          BACKEND_URL: http://localhost:8080
