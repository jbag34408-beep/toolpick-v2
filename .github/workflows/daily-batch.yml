# 매일 배치 (v2): 웹 서버를 깨우지 않고, 러너에서 batch 프로필로 직접 실행한다 (docs/design/v2-00-backend.md 4.1)
# [CS] v1은 Render를 깨워 HTTP로 배치를 시작하고 60분 동안 상태를 폴링했다. v2는 배치가 별도 프로세스라
# 실행이 곧 감시다. 종료 코드 0=완료, 1=실패(이 작업이 실패로 표시돼 메일이 온다), 2=다른 실행이 도는 중.
#
# 지금은 수동 실행만 연다. 웹·배치를 어디서 돌릴지(열린 결정 E3)와 전환 날(v1 배치 중지) 뒤에 schedule을 켠다.
# 켤 때 cron은 UTC 기준이고 정시(0분)를 피한다(실행 누락 사례): '17 18 * * *' = 03:17 KST
name: Daily batch

on:
  workflow_dispatch:
    inputs:
      date:
        description: '배치 날짜 (YYYY-MM-DD, 비우면 오늘 KST)'
        required: false
  # schedule:
  #   - cron: '17 18 * * *'

jobs:
  batch:
    runs-on: ubuntu-latest
    # stale-after(70분)보다 짧아야 한다. 이 시간을 넘기면 러너가 SIGTERM을 보내고 배치는 FAILED로 기록한다
    timeout-minutes: 65
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: 빌드
        run: ./gradlew bootJar --no-daemon -x test
      - name: 배치 실행
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.TOOLPICK_GITHUB_TOKEN }}   # GITHUB_TOKEN은 Actions 예약 이름이라 다른 이름의 시크릿을 쓴다
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # 입력값은 환경 변수로 넘기고 형식을 검사한다 (스크립트에 직접 끼워 넣으면 명령 주입이 된다)
          BATCH_DATE: ${{ inputs.date }}
        run: |
          ARGS="--spring.profiles.active=batch"
          if [ -n "$BATCH_DATE" ]; then
            [[ "$BATCH_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "날짜 형식이 아님: $BATCH_DATE"; exit 1; }
            ARGS="$ARGS --date=$BATCH_DATE"
          fi
          java -XX:MaxRAMPercentage=75 -jar build/libs/toolpick-*.jar $ARGS
