spring:
  datasource:
    url: jdbc:postgresql://overridden-by-testcontainers/test

toolpick:
  retry-base-delay: 10ms
  github:
    token: test-token
  gemini:
    api-key: test-key
  groq:
    api-key: test-key
  admin-logins: admin-user
  analysis:
    request-interval: 0s
  batch:
    run-on-startup: false           # batch 프로필 컨텍스트를 띄우는 테스트에서 배치가 저절로 돌지 않게
