# 배치 프로필: 웹 서버 없이 오늘 배치를 한 번 돌리고 종료한다 (batch.BatchJobRunner, docs/design/v2-00-backend.md 4.1)
# 실행: java -jar app.jar --spring.profiles.active=batch   (수동 재실행: --date=2026-10-30)
spring:
  main:
    web-application-type: none      # 내장 톰캣을 띄우지 않는다. 보안·CORS 설정은 @ConditionalOnWebApplication이라 만들어지지 않는다
  flyway:
    enabled: false                  # 스키마는 웹이 배포될 때만 바꾼다. 새벽 배치가 스키마를 바꾸는 일을 막는다
  ai:
    mcp:
      server:
        enabled: false              # MCP 서버는 웹에서만
