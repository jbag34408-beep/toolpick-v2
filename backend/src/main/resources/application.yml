# 스프링 부트 설정 (모든 환경 공통)
# [문법] ${ENV_NAME:기본값} — 환경 변수가 있으면 그 값, 없으면 콜론 뒤 기본값. 기본값이 없으면(${DATABASE_URL}) 시작할 때 꼭 필요하다
# [CS] 비밀값(토큰·키)은 파일에 쓰지 않고 환경 변수로 넣는다
server:
  port: ${PORT:8080}
  # 프록시(Vercel rewrite·호스팅) 뒤에서 X-Forwarded-* 헤더를 따른다. OAuth 리다이렉트 주소를 https로 만들기 위해 필요
  forward-headers-strategy: framework

spring:
  config:
    # backend/.env(KEY=값 형식, git에 안 올라감)가 있으면 읽는다. 같은 이름의 환경 변수가 있으면 환경 변수가 우선한다
    import: optional:file:.env[.properties]
  application:
    name: toolpick
  datasource:
    url: ${DATABASE_URL}            # jdbc:postgresql://<host>/<db>?user=..&password=..&sslmode=require
    hikari:
      maximum-pool-size: 5          # Neon 무료 DB의 동시 연결 수가 적다
  jpa:
    open-in-view: false             # 응답이 끝날 때까지 DB 연결을 붙잡지 않는다
    hibernate:
      ddl-auto: validate            # 구조는 Flyway만 바꾼다
  flyway:
    enabled: true                   # 웹만 마이그레이션한다 (batch 프로필은 끈다: application-batch.yml)
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_OAUTH_CLIENT_ID:local}
            client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:local}
            scope: read:user
            # 프론트 도메인으로 콜백을 받아 rewrite로 넘긴다 (세션 쿠키가 프론트 도메인에 붙도록)
            redirect-uri: ${toolpick.frontend-origin}/login/oauth2/code/{registrationId}
  ai:
    mcp:
      server:
        name: toolpick
        version: 2.0.0
        type: SYNC
        protocol: STREAMABLE        # POST /mcp 하나로 통신 (Claude·Cursor 원격 MCP 방식)

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.toolpick: INFO
    org.hibernate.orm.connections.pooling: WARN   # 시작 로그에 DATABASE_URL(비밀번호 포함)이 찍히는 것을 막는다

# 툴픽 전용 설정 → ToolPickProperties
toolpick:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  admin-logins: ${ADMIN_LOGINS:}    # 쉼표로 구분한 GitHub 로그인 이름
  retry-base-delay: 1s
  github:
    token: ${GITHUB_TOKEN:}         # 배치만 쓴다. 웹은 비어 있어도 뜬다
    base-url: https://api.github.com
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash}
    base-url: https://generativelanguage.googleapis.com
  groq:                             # 먼저 쓰는 AI. 키가 비어 있으면 Gemini만 쓴다 (analysis.FallbackAnalyzer)
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:openai/gpt-oss-120b}
  job:
    stale-after: 70m                # 이보다 오래된 RUNNING은 끊긴 실행으로 보고 다시 시작한다. 실행 환경 제한 시간은 이보다 짧게
  candidate:                        # 후보 레포 검색 조건
    min-stars: 100
    created-within-days: 90
    pushed-within-days: 30
    max-per-day: 300
    track-pushed-within-days: 60    # 매일 수집·판별 대상: 이 기간 안에 푸시된 레포 (공개·북마크 레포는 항상)
  analysis:
    publish-threshold: 0.8          # AI 확신도가 이 값 이상이면 자동 공개·거절, 미만이면 관리자 검수
    max-per-day: 100                # 0이면 판별 단계를 건너뛴다(그림자 실행용)
    request-interval: 20s           # Groq 무료 분당 8,000토큰 ÷ 요청당 약 2천 토큰 → 분당 3회 이하
    # 레포 이름의 단어가 이 중 하나면 AI 없이 거절. 도구 이름에도 쓰이는 애매한 단어(course, interview)는 넣지 않는다
    reject-name-words: awesome, tutorial, tutorials, dotfiles, roadmap
