# 로컬 개발: docker-compose의 PostgreSQL에 붙는다
# 웹:   ./gradlew bootRun --args='--spring.profiles.active=local'
# 배치: ./gradlew bootRun --args='--spring.profiles.active=local,batch'
#      (batch 프로필은 Flyway를 끄므로, 빈 DB라면 웹을 한 번 먼저 띄워 테이블을 만든다)
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/toolpick
    username: toolpick
    password: toolpick

logging:
  level:
    com.toolpick: DEBUG
